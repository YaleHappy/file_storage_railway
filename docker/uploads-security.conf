# Group storage must never be served directly: membership is checked by PHP.
<Directory /var/www/html/uploads/.group-files>
    Require all denied
</Directory>

# Uploaded files are data, never executable application code.
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
